  // Handle the search form submission
  document.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault(); // Prevent form from refreshing the page

    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    const resultsDiv = document.getElementById("searchResults");
    resultsDiv.innerHTML = ""; // Clear previous results

    if (query === "") {
      resultsDiv.innerHTML = "<p>Please enter a search term.</p>";
      return;
    }

    // Filter data based on the query
    const results = data.filter(item => item.name.toLowerCase().includes(query));

    if (results.length > 0) {
      results.forEach(item => {
        const div = document.createElement("div");
        div.className = "result-item";

        // Product image
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.name;

        // Product name with link
        const name = document.createElement("h3");
        const link = document.createElement("a");
        link.href = item.link;
        link.textContent = item.name;
        name.appendChild(link);

        // Add image and name to result-item
        div.appendChild(img);
        div.appendChild(name);

        resultsDiv.appendChild(div);
      });
    } else {
      resultsDiv.innerHTML = "<p>No results found!</p>";
    }
  });

<script>
  // Banner Slider Script
  let slideIndex = 0;
  const slides = document.querySelectorAll('.banner-slide');

  function changeSlide(direction) {
    slides[slideIndex].classList.remove('active');
    slideIndex = (slideIndex + direction + slides.length) % slides.length;
    slides[slideIndex].classList.add('active');
  }

  setInterval(() => changeSlide(1), 4000);

  // Toggle categories
  let isExpanded = false;
  function toggleCategories() {
    const extraCategories = document.getElementById("extraCategories");
    const arrow = document.querySelector(".expand-arrow");
    if (isExpanded) {
      extraCategories.style.display = "none";
      arrow.innerHTML = "&#9660; Show More";
    } else {
      extraCategories.style.display = "block";
      arrow.innerHTML = "&#9650; Show Less";
    }
    isExpanded = !isExpanded;
  }
</script>
